services:
  postgres-db:
    image: pgvector/pgvector:pg15
    container_name: postgres-db
    environment:
      POSTGRES_DB: jobsdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d jobsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobsdb-network

  redis-mq:
    image: redis:7-alpine
    container_name: redis-mq
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobsdb-network

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-api
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://admin:dev_password@postgres-db:5432/jobsdb
      REDIS_URL: redis://redis-mq:6379/0
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-https://api.deepseek.com/anthropic}
      CUSTOM_API_FORMAT: ${CUSTOM_API_FORMAT:-anthropic}
      CUSTOM_MODEL: ${CUSTOM_MODEL:-deepseek-v4-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-custom}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
      DEBUG: "true"
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobsdb-network

  scheduler-worker:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://admin:dev_password@postgres-db:5432/jobsdb
      REDIS_URL: redis://redis-mq:6379/0
      WORKER_NAME: scheduler-worker
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-mq:
        condition: service_healthy
    networks:
      - jobsdb-network

  crawl-worker:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python -m app.workers.run_crawl_worker
    environment:
      DATABASE_URL: postgresql://admin:dev_password@postgres-db:5432/jobsdb
      REDIS_URL: redis://redis-mq:6379/0
      WORKER_NAME: crawl-worker
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-mq:
        condition: service_healthy
    networks:
      - jobsdb-network

  ingest-worker:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python -m app.workers.run_ingest_worker
    environment:
      DATABASE_URL: postgresql://admin:dev_password@postgres-db:5432/jobsdb
      REDIS_URL: redis://redis-mq:6379/0
      WORKER_NAME: ingest-worker
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-mq:
        condition: service_healthy
    networks:
      - jobsdb-network

  enrichment-worker:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python -m app.workers.run_enrichment_worker
    environment:
      DATABASE_URL: postgresql://admin:dev_password@postgres-db:5432/jobsdb
      REDIS_URL: redis://redis-mq:6379/0
      WORKER_NAME: enrichment-worker
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-mq:
        condition: service_healthy
    networks:
      - jobsdb-network

  embedding-worker:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python -m app.workers.run_embedding_worker
    environment:
      DATABASE_URL: postgresql://admin:dev_password@postgres-db:5432/jobsdb
      REDIS_URL: redis://redis-mq:6379/0
      WORKER_NAME: embedding-worker
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-mq:
        condition: service_healthy
    networks:
      - jobsdb-network

  retrieval-api:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://admin:dev_password@postgres-db:5432/jobsdb
      REDIS_URL: redis://redis-mq:6379/0
      WORKER_NAME: retrieval-api
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-mq:
        condition: service_healthy
    networks:
      - jobsdb-network

  recommendation-api:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://admin:dev_password@postgres-db:5432/jobsdb
      REDIS_URL: redis://redis-mq:6379/0
      WORKER_NAME: recommendation-api
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-mq:
        condition: service_healthy
    networks:
      - jobsdb-network

  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Browser-side absolute API URLs must stay host-reachable.
      VITE_API_URL: http://localhost:8000
      # Vite's server-side proxy runs inside the container, so it should use the service name.
      VITE_PROXY_TARGET: http://backend-api:8000
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobsdb-network

volumes:
  pg_data:
  redis_data:
  frontend_node_modules:

networks:
  jobsdb-network:
    driver: bridge
