services:
  # ============================================
  # Development Overrides for Backend
  # ============================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      DEBUG: "true"
      PYTHONUNBUFFERED: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================
  # Development Overrides for Frontend
  # ============================================
  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend-api:8000
    command: npm run dev -- --host 0.0.0.0
